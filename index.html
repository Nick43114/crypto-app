<style>
  :root {
    --bg: #17212b;
    --card: #232e3c;
    --text: #ffffff;
    --muted: #7f91a4;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f1c40f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 12px;
    padding-bottom: 24px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .title { font-size: 20px; font-weight: 700; }
  .updated { font-size: 12px; color: var(--muted); }
  .refresh {
    background: var(--card); border: none; color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  .refresh:active { opacity: 0.7; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
  .card {
    background: var(--card); border-radius: 14px; padding: 12px; cursor: pointer;
    transition: transform 0.1s;
  }
  .card:active { transform: scale(0.97); }
  .coin-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .price { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
  .change { font-size: 13px; margin-bottom: 8px; }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    padding: 4px 8px; border-radius: 8px; line-height: 1.2;
  }
  .buy  { background: rgba(46,204,113,0.15); color: var(--green); }
  .sell { background: rgba(231,76,60,0.15);  color: var(--red); }
  .wait { background: rgba(241,196,15,0.15); color: var(--yellow); }
  .spark { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .status { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  .pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">📊 Crypto Trader</div>
      <div class="updated" id="updated">обновляю...</div>
    </div>
    <button class="refresh" id="refreshBtn">🔄</button>
  </div>
  <div class="grid" id="grid">
    <div class="status pulse">Загружаю цены...</div>
  </div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#17212b');
  tg.setBackgroundColor('#17212b');
}

const COINS = ["BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT","XRPUSDT",
               "DOGEUSDT","ADAUSDT","AVAXUSDT","LINKUSDT","DOTUSDT"];
const LOW_ZONE = 2, HIGH_ZONE = 2;
const REFRESH_MS = 10000;

function fmt(x) {
  return x < 10
    ? "$" + x.toFixed(4).replace(/\.?0+$/, "")
    : "$" + x.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function verdict(s) {
  const price = parseFloat(s.lastPrice);
  const low = parseFloat(s.lowPrice), high = parseFloat(s.highPrice);
  if (price <= low * (1 + LOW_ZONE/100))  return ["buy",  "🟢 ПОКУПАТЬ"];
  if (price >= high * (1 - HIGH_ZONE/100)) return ["sell", "🔴 ПРОДАВАТЬ"];
  return ["wait", "🟡 ЖДАТЬ"];
}

async function load() {
  try {
    const symbols = encodeURIComponent(JSON.stringify(COINS));
    const r = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbols=" + symbols);
    const data = await r.json();
    render(Array.isArray(data) ? data : []);
  } catch (e) {
    document.getElementById("updated").textContent = "ошибка сети, повтор...";
  }
}

function render(items) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const map = {};
  items.forEach(i => map[i.symbol] = i);

  COINS.forEach(sym => {
    const s = map[sym];
    if (!s) return;
    const name = sym.replace("USDT", "");
    const price = parseFloat(s.lastPrice);
    const chg = parseFloat(s.priceChangePercent);
    const [cls, text] = verdict(s);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      '<div class="coin-name">' + name + '</div>' +
      '<div class="price">' + fmt(price) + '</div>' +
      '<div class="change ' + (chg >= 0 ? "up" : "down") + '">' +
        (chg >= 0 ? "▲ +" : "▼ ") + chg.toFixed(2) + '%' +
      '</div>' +
      '<span class="badge ' + cls + '">' + text + '</span>' +
      '<div class="spark">мин ' + fmt(parseFloat(s.lowPrice)) +
      ' · макс ' + fmt(parseFloat(s.highPrice)) + '</div>';
    card.onclick = () => {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    };
    grid.appendChild(card);
  });

  const t = new Date();
  document.getElementById("updated").textContent =
    "обновлено " + t.toLocaleTimeString("ru-RU");
}

document.getElementById("refreshBtn").onclick = () => {
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
  load();
};

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
